<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memotest Mundial 2026</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/juego.css">
</head>
<body>
    <header>
        <h1>Memotest Mundial 2026</h1>
        <nav>
            <a href="pages/contacto.html">Contacto</a>
            <a href="https://github.com/RodoM/final_daw_2026" target="_blank" rel="noopener noreferrer">Repositorio en GitHub</a>
        </nav>
    </header>
    <main>
        <section class="pantalla-inicio" id="pantalla-inicio">
            <h2>Comenzar partida</h2>
            <form class="formulario-inicio" id="formulario-inicio">
                <label for="nombre-jugador">Tu nombre</label>
                <input type="text" id="nombre-jugador" name="nombre-jugador" autocomplete="off">
                <label for="nivel">Nivel</label>
                <select id="nivel" name="nivel">
                    <option value="">Elegí un nivel</option>
                    <option value="facil">Fácil (16 cartas)</option>
                    <option value="medio">Medio (20 cartas)</option>
                    <option value="dificil">Difícil (36 cartas)</option>
                </select>
                <p class="mensaje-error oculto" id="error-inicio"></p>
                <button type="submit" class="boton-principal">Comenzar</button>
            </form>
        </section>
        <section class="pantalla-juego oculto" id="pantalla-juego">
            <section class="panel-marcadores" id="panel-marcadores">
                <p>Intentos: <span id="marcador-intentos">0</span></p>
                <p>Pares: <span id="marcador-pares">0</span></p>
                <p>Errores: <span id="marcador-errores">0</span></p>
                <p>Puntaje: <span id="marcador-puntaje">0</span></p>
                <p>Tiempo: <span id="marcador-tiempo">00:00</span></p>
            </section>
            <div class="panel-controles">
                <button type="button" class="boton-secundario" id="boton-reiniciar">Reiniciar partida</button>
                <button type="button" class="boton-secundario" id="boton-volver-inicio">Volver al inicio</button>
            </div>
            <div class="tablero" id="tablero"></div>
        </section>
        <div class="modal-fondo oculto" id="modal-victoria">
            <div class="modal-contenido" id="modal-contenido-victoria" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-victoria" tabindex="-1">
                <h2 id="titulo-modal-victoria">¡Partida completada!</h2>
                <p>Jugador: <span id="resultado-nombre"></span></p>
                <p>Nivel: <span id="resultado-nivel"></span></p>
                <p>Intentos: <span id="resultado-intentos"></span></p>
                <p>Errores: <span id="resultado-errores"></span></p>
                <p>Tiempo: <span id="resultado-tiempo"></span></p>
                <p>Puntaje final: <span id="resultado-puntaje"></span></p>
                <div class="modal-botones">
                    <button type="button" class="boton-principal" id="boton-jugar-de-nuevo">Jugar de nuevo</button>
                    <button type="button" class="boton-secundario" id="boton-cerrar-modal">Cerrar</button>
                </div>
            </div>
        </div>
    </main>
    <footer></footer>
    <script src="js/validaciones.js"></script>
    <script src="js/datos-cartas.js"></script>
    <script src="js/logica-juego.js"></script>
    <script src="js/interfaz.js"></script>
    <script src="js/eventos.js"></script>
    <script src="js/inicio.js"></script>
</body>
</html>
