<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto — Memotest Mundial 2026</title>
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/contacto.css">
    <script src="../js/almacenamiento.js"></script>
    <script src="../js/tema.js"></script>
</head>
<body>
    <header>
        <h1>Memotest Mundial 2026</h1>
        <nav>
            <a href="../index.html">Volver al juego</a>
            <a href="https://github.com/RodoM/final_daw_2026" target="_blank" rel="noopener noreferrer">Repositorio en GitHub</a>
            <a href="https://rodom.github.io/final_daw_2026/" target="_blank" rel="noopener noreferrer">Ver en GitHub Pages</a>
        </nav>
        <div class="acciones-header">
            <button type="button" class="boton-header" id="boton-tema">Modo oscuro</button>
        </div>
    </header>
    <main>
        <section class="pantalla-contacto">
            <h2>Contacto</h2>
            <form class="formulario-contacto" id="formulario-contacto">
                <label for="nombre-contacto">Nombre</label>
                <input type="text" id="nombre-contacto" name="nombre-contacto" autocomplete="name">
                <p class="mensaje-error oculto" id="error-nombre-contacto"></p>

                <label for="mail-contacto">Mail</label>
                <input type="text" id="mail-contacto" name="mail-contacto" autocomplete="email">
                <p class="mensaje-error oculto" id="error-mail-contacto"></p>

                <label for="mensaje-contacto">Mensaje</label>
                <textarea id="mensaje-contacto" name="mensaje-contacto" rows="6"></textarea>
                <p class="mensaje-error oculto" id="error-mensaje-contacto"></p>

                <button type="submit" class="boton-principal">Enviar</button>
            </form>
        </section>
    </main>
    <footer></footer>
    <script src="../js/validaciones.js"></script>
    <script src="../js/contacto.js"></script>
</body>
</html>
